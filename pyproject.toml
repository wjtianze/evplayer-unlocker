[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evplayer-unlocker"
version = "1.0.0"
description = "Export authorized EVPlayer 3.4.9.1 V4A recordings to ordinary MP4 files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pycryptodome==3.23.0"]

[project.scripts]
evplayer-unlocker = "evplayer_unlocker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
